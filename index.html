<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Limerick Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Limerick Generator</h1>
      </header>

      <main>
        <form id="limerick-form">
          <input
            type="text"
            placeholder="e.g., cats, pizza, space"
            id="topic"
            name="topic"
            required
            autofocus
            autocomplete="off"
            class="instructions"
          />
          <input type="submit" value="Submit" class="button" />
        </form>

        <div class="limerick" id="limerick"></div>
      </main>

      <footer>
        This AI project was created by
        <a href="https://github.com/Jess90AB" target="_blank">Jess Burton</a>,
        is open-sourced on
        <a href="https://github.com/Jess90AB/limerick-generator" target="_blank"
          >GitHub</a
        >
        and is hosted on
        <a href="https://ai-limerick-generator.netlify.app/" target="_blank"
          >Netlify</a
        >.
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
